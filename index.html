<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amaan Baig — I make complicated software feel obvious</title>
  <meta name="description" content="Amaan Baig makes complicated software feel obvious. Experience for judgment, AI for speed.">
  <meta name="theme-color" content="#040603">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="Hippo-Xjja.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="ppmondwest-regular.otf" as="font" type="font/otf" crossorigin>

  <style>

@font-face { font-family: "Hippo"; src: url(Hippo-Xjja.otf) format("opentype"); font-display: swap; }
@font-face { font-family: "PP Mondwest"; src: url(ppmondwest-regular.otf) format("opentype"); font-display: swap; }
:root {
  --bg: #040603; --accent: #AAFF66; --text: #F4F4F0; --line: #34362f;
  --x: 40px;                 /* X: top/bottom padding, logo-to-content gap */
  --y: 40px;                 /* Y: left/right padding */
  /* type unit: 1 design px at a 1440 x 1024 frame. It shrinks with the window's width,
     or with the height left for the columns (1024 minus 150px of padding, logo and gaps = 874) */
  --u: min(calc(100vw / 1440), calc((100vh - 150px) / 874));
  --sans: "Plus Jakarta Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; height: 100svh; padding: var(--x) var(--y); background: var(--bg); color: var(--text); font-family: var(--sans);
  display: grid; grid-template-rows: auto 1fr; row-gap: var(--x); -webkit-font-smoothing: antialiased; overflow: hidden; }
.logo { justify-self: start; color: var(--accent); font: 500 calc(23 * var(--u))/1.3 var(--sans); letter-spacing: .01em; text-decoration: none; }
.cols { display: grid; grid-template-columns: repeat(3, 25%); justify-content: space-between; min-height: 0; } /* three equal columns, each 1/4 of the width; the two gaps share the rest equally */
/* column 1 */
.c1 { display: flex; flex-direction: column; min-height: 0; }
.make, .feel { margin: 0; font: 400 calc(57.5 * var(--u))/.8 "Hippo", var(--sans); letter-spacing: .01em; }
.vert { margin: calc(22 * var(--u)) 0 0; align-self: flex-start; white-space: nowrap;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font: 400 calc(86.5 * var(--u))/.76 "PP Mondwest", serif; }
.feel { margin-top: calc(32 * var(--u)); }
.obv { margin: calc(18 * var(--u)) 0 0; color: var(--accent); font: 400 calc(58 * var(--u))/1 var(--sans); letter-spacing: -.01em; }
.note { margin-top: auto; display: flex; gap: calc(12 * var(--u)); align-items: flex-start; }
.note svg { flex: none; width: calc(22 * var(--u)); margin-top: calc(2 * var(--u)); }
.note p { margin: 0; font: 400 calc(21.5 * var(--u))/1.27 var(--sans); max-width: calc(240 * var(--u)); }
/* columns 2 and 3: content sits on the bottom edge; headings share one top line */
.c2, .c3 { display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; }
.head { margin: 0 0 calc(30 * var(--u)); color: var(--accent); font: 400 calc(24 * var(--u))/1.25 var(--sans); }
.clients { margin: 0; padding: 0 0 0 var(--g); list-style: none; border-left: 1px solid var(--line);
  display: flex; flex-direction: column; justify-content: space-between; height: calc(340 * var(--u) - var(--g)); }
/* one gap G for title-to-first-logo, between logos, and line-to-logos: the 340 of heading margin + list
   holds the logos (133 tall at 1x, 157 at 1.18x) and six equal gaps, so G = (340 - 157) / 6 = 30.5 */
.c2 { --g: calc(30.5 * var(--u)); }
.c2 .head { margin-bottom: var(--g); }
/* each logo at its width in the design (the SVGs aren't drawn at one shared scale) */
.clients img { display: block; height: auto; width: calc(var(--w) * 1.18 * var(--u)); } /* 1.18x the design widths */
/* ---------- Carousel around the glass spark ---------- */
/* 8 curved cards repeat 4 images (1 2 3 4 1 2 3 4). Swap the files in assets/cards/ to change them. */
.orbit {
  --img-1: url('assets/cards/claude.jpg'); --img-2: url('assets/cards/chatgpt.jpg');
  --img-3: url('assets/cards/notebooklm.jpg'); --img-4: url('assets/cards/figma.jpg');
  --fill-1: #D77655; --fill-2: #74AA9C; --fill-3: #000; --fill-4: #fff; /* shown while the images load */
  position: relative;
  width: calc((100vw - 2 * var(--y) - 4 * var(--x)) / 4); align-self: flex-end; /* the size it had in the 1fr 2fr 1fr grid (300 at 1440), on the column's right edge */
  height: calc(310 * var(--u)); /* same height as the logo list, so both headings share one line */
  display: grid; place-items: center;
  perspective: 1400px; transform-style: preserve-3d;
  pointer-events: none;
}
.orbit > * { grid-area: 1 / 1; translate: 0 var(--drop, 0px); } /* --drop (set by the script) puts the ring's lowest point on the bottom line */
/* .tilt holds the ring's angle and a gentle float; .ring spins at a constant speed */
.tilt, .ring { display: block; position: relative; width: var(--card, 60px); height: var(--card, 60px); transform-style: preserve-3d; }
.tilt { transform: rotateZ(-35deg) rotateX(-28deg); animation: sway 3.5s ease-in-out infinite alternate; }
.ring { transform: rotateY(22.5deg); animation: spin 24s linear infinite; }
@keyframes sway {
  from { transform: translateY(1.5%) rotateZ(-36deg) rotateX(-28deg); }
  to   { transform: translateY(-1.5%) rotateZ(-34deg) rotateX(-28deg); }
}
@keyframes spin { from { transform: rotateY(22.5deg); } to { transform: rotateY(-337.5deg); } }
.tile, .slice { position: absolute; transform-style: preserve-3d; }
.tile { inset: 0; }
/* Each card is built from thin vertical slices so it bends with the ring */
.slice { top: 0; left: 50%; height: 100%; }
.slice i {
  position: absolute; inset: 0;
  background:
    linear-gradient(rgba(0, 0, 0, var(--depth, 0)), rgba(0, 0, 0, var(--depth, 0))),
    linear-gradient(rgba(0, 0, 0, var(--shade, 0)), rgba(0, 0, 0, var(--shade, 0))),
    var(--img) var(--bx) 0 / var(--card) 100% no-repeat,
    var(--fill);
  -webkit-mask: var(--corner) var(--bx) 0 / var(--card) 100% no-repeat;
          mask: var(--corner) var(--bx) 0 / var(--card) 100% no-repeat;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
/* Inner side of a card: only ever seen on the far side of the ring, so it is always dimmed and blurred */
.slice i + i { transform: rotateY(180deg); --bx: var(--bx-back); --depth: .6; filter: blur(2px); }

.spark {
  width: 64%; height: auto; overflow: visible;   /* bigger star */
  filter: drop-shadow(0 calc(6 * var(--u)) calc(16 * var(--u)) rgba(120, 230, 70, .4));
  animation: float 5s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-3%) rotate(8deg); }
}

/* Phones and narrow windows: a simple stacked version until the phone layout is designed */
@media (max-width: 900px) {
  :root { --u: min(1px, calc(100vw / 420)); }
  body { height: auto; overflow: visible; }
  .cols { grid-template-columns: 1fr; row-gap: calc(var(--x) * 2); }
  .note { margin-top: calc(28 * var(--u)); }
  .orbit { width: min(100%, calc(300 * var(--u))); align-self: auto; height: auto; aspect-ratio: 1; }
}
.logo:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
  @media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
</head>
<body>
  <header><a class="logo" href="./" aria-label="Amaan Baig, home">AMAAN BAIG.</a></header>

  <main class="cols">
    <!-- Column 1: I make complicated software feel obvious -->
    <section class="c1" aria-label="Introduction">
      <h1 class="make">I MAKE</h1>
      <p class="vert">COMPLICATED<br>SOFTWARE</p>
      <p class="feel">FEEL</p>
      <p class="obv">Obvious.</p>
      <div class="note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g stroke="#AAFF66" stroke-width="3.6" stroke-linecap="round"><path d="M12 2.5v19"/><path d="M3.8 7.25l16.4 9.5"/><path d="M3.8 16.75l16.4-9.5"/></g></svg>
        <p>Sometimes with a little visual creativity, when required.</p>
      </div>
    </section>

    <!-- Column 2: experience, with the companies -->
    <section class="c2" aria-label="Experience">
      <h2 class="head">Experience for judgment.</h2>
      <ul class="clients" aria-label="Companies I've worked with">
        <li><img src="JJLandLaSalleLogo.svg" alt="JLL Technologies and LaSalle Investment Management" style="--w:259"></li>
        <li><img src="NokiaLogo.svg" alt="Nokia" style="--w:85"></li>
        <li><img src="GloballogicLogo.svg" alt="GlobalLogic" style="--w:114"></li>
        <li><img src="MarlabsLogo.svg" alt="Marlabs" style="--w:95"></li>
        <li><img src="ZitharaLogo.svg" alt="Zithara.ai" style="--w:96"></li>
        <li><img src="ExceledgeLogo.svg" alt="Excel Edge" style="--w:79"></li>
      </ul>
    </section>

    <!-- Column 3: AI -->
    <section class="c3" aria-label="AI">
      <h2 class="head">AI for speed.</h2>
      <!-- Glass spark with 8 curved cards repeating 4 logos (Claude, ChatGPT, NotebookLM, Figma); images in assets/cards/ -->
      <span class="orbit" id="orbit" aria-hidden="true">
        <span class="tilt"><span class="ring" id="ring"></span></span> <!-- cards are built by the script below -->
        <svg class="spark" viewBox="0 0 100 100">
          <defs>
            <!-- green liquid inside the glass -->
            <radialGradient id="sparkCore" cx="56%" cy="60%" r="58%">
              <stop offset="0" stop-color="#F2FFDC"/>
              <stop offset=".22" stop-color="#C4FB8C"/>
              <stop offset=".55" stop-color="#6FD83A"/>
              <stop offset="1" stop-color="#1B5E12"/>
            </radialGradient>
            <!-- shade on the lower-right faces for volume -->
            <linearGradient id="sparkShade" x1="20%" y1="20%" x2="85%" y2="90%">
              <stop offset=".45" stop-color="#0B2A06" stop-opacity="0"/>
              <stop offset="1" stop-color="#0B2A06" stop-opacity=".55"/>
            </linearGradient>
            <!-- glass sheen on the upper-left faces -->
            <linearGradient id="sparkSheen" x1="10%" y1="5%" x2="60%" y2="60%">
              <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
              <stop offset=".4" stop-color="#fff" stop-opacity=".22"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <!-- rim light -->
            <linearGradient id="sparkRim" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="1"/>
              <stop offset=".5" stop-color="#E8FFD0" stop-opacity=".25"/>
              <stop offset="1" stop-color="#C8FF96" stop-opacity=".8"/>
            </linearGradient>
            <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#FAFFF0" stop-opacity=".95"/>
              <stop offset="1" stop-color="#B9FA7C" stop-opacity="0"/>
            </radialGradient>
            <filter id="sparkSoft" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.2"/>
            </filter>
            <clipPath id="sparkClip"><path d="M50 3C55 33 67 45 97 50 67 55 55 67 50 97 45 67 33 55 3 50 33 45 45 33 50 3Z"/></clipPath>
          </defs>
          <g clip-path="url(#sparkClip)">
            <rect width="100" height="100" fill="url(#sparkCore)"/>
            <rect width="100" height="100" fill="url(#sparkShade)"/>
            <!-- refracted glow in the middle -->
            <circle cx="52" cy="54" r="17" fill="url(#sparkGlow)" filter="url(#sparkSoft)"/>
            <!-- upper-left facets catch the light -->
            <path d="M50 3C55 33 67 45 97 50H50Z M3 50C33 45 45 33 50 3V50Z" fill="url(#sparkSheen)"/>
            <!-- darker inner edge -->
            <path d="M50 3C55 33 67 45 97 50 67 55 55 67 50 97 45 67 33 55 3 50 33 45 45 33 50 3Z" fill="none" stroke="#0E3A08" stroke-opacity=".45" stroke-width="5" filter="url(#sparkSoft)"/>
          </g>
          <path d="M50 3C55 33 67 45 97 50 67 55 55 67 50 97 45 67 33 55 3 50 33 45 45 33 50 3Z" fill="none" stroke="url(#sparkRim)" stroke-width="1.2"/>
          <!-- specular highlights -->
          <path d="M47.5 12C48.5 24 49 31 45 39" stroke="#fff" stroke-width="3" stroke-opacity=".55" stroke-linecap="round" fill="none" opacity=".9" filter="url(#sparkSoft)"/>
          <ellipse cx="46.5" cy="22" rx="1.1" ry="4.5" fill="#fff" opacity=".95" transform="rotate(-6 46.5 22)"/>
          <ellipse cx="24" cy="48.2" rx="9" ry="1.1" fill="#fff" opacity=".55"/>
          <circle cx="62" cy="62" r="1.6" fill="#fff" opacity=".5"/>
        </svg>
      </span>
    </section>
  </main>
  <script>
    (function () {
      /* Carousel: builds 8 curved cards sized to the ring; the spin itself is a CSS animation */
      var orbit = document.getElementById('orbit');
      var ring = document.getElementById('ring');
      var CARDS = 8, SLICES = 8, GAP = 360 / CARDS;
      var CORNER = 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" preserveAspectRatio="none"><rect width="40" height="40" rx="10"/></svg>') + '")';
      function buildOrbit() {
        var size = orbit.getBoundingClientRect().width;
        var r = size / 2.7;                // ring radius: ring + one card fill the box
        var card = r * 0.42;               // card width and height along the curve (smaller cards)
        orbit.style.setProperty('--card', card.toFixed(2) + 'px');
        var arc = card / r;                // card angle in radians
        var d = arc / SLICES;              // slice angle
        var w = 2 * r * Math.sin(d / 2) + 1.2;   // slice width (+ overlap hides seams)
        var html = '';
        for (var c = 0; c < CARDS; c++) {
          var k = c % 4 + 1;
          html += '<span class="tile" style="--img:var(--img-' + k + ');--fill:var(--fill-' + k + ');--corner:' + CORNER.replace(/"/g, '&quot;') + ';transform:rotateY(' + c * GAP + 'deg)">';
          for (var n = 0; n < SLICES; n++) {
            var t = (n - (SLICES - 1) / 2) * d;   // slice offset from the card's centre
            var shade = (0.22 * Math.abs(t) / (arc / 2)).toFixed(3);
            html += '<span class="slice" style="width:' + w.toFixed(2) + 'px;margin-left:' + (-w / 2).toFixed(2) + 'px;' +
              'transform:rotateY(' + (t * 180 / Math.PI).toFixed(3) + 'deg) translateZ(' + r.toFixed(2) + 'px);' +
              '--bx:' + (-n * card / SLICES).toFixed(2) + 'px;--bx-back:' + (-(SLICES - 1 - n) * card / SLICES).toFixed(2) + 'px;--shade:' + shade + '">' +
              '<i></i><i></i></span>';
          }
          html += '</span>';
        }
        ring.innerHTML = html;
        alignBottom();
      }

      // Lower the carousel so its lowest point, over a full turn, sits on the bottom line.
      // Measured twice: moving the ring down changes its perspective slightly, so the second pass corrects that.
      function alignBottom() {
        var tilt = orbit.querySelector('.tilt'), spark = orbit.querySelector('.spark');
        var faces = ring.querySelectorAll('.slice i:first-child');
        [ring, tilt, spark].forEach(function (el) { el.style.animation = 'none'; });
        tilt.style.transform = 'rotateZ(-35deg) rotateX(-28deg)';
        function lowestPoint() {
          var lowest = spark.getBoundingClientRect().bottom;
          for (var a = 0; a < 360; a += 5) {
            ring.style.transform = 'rotateY(' + (22.5 - a) + 'deg)';
            for (var f = 0; f < faces.length; f++) lowest = Math.max(lowest, faces[f].getBoundingClientRect().bottom);
          }
          return lowest;
        }
        var drop = 0;
        for (var pass = 0; pass < 2; pass++) {
          orbit.style.setProperty('--drop', drop.toFixed(1) + 'px');
          drop = Math.max(0, drop + orbit.getBoundingClientRect().bottom - lowestPoint());
        }
        orbit.style.setProperty('--drop', drop.toFixed(1) + 'px');
        [ring, tilt, spark].forEach(function (el) { el.style.animation = ''; el.style.transform = ''; });
      }

      buildOrbit();
      var lastW = window.innerWidth, t;
      window.addEventListener('resize', function () {
        clearTimeout(t);
        if (window.innerWidth !== lastW) { lastW = window.innerWidth; t = setTimeout(buildOrbit, 120); }   // new width: rebuild the cards
        else t = setTimeout(alignBottom, 120);                                                            // new height only: re-align
      });
    })();
  </script>
</body>
</html>
